<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B4BE8" />
      <stop offset=".52" stop-color="#C9407A" />
      <stop offset="1" stop-color="#F0913A" />
    </linearGradient>
  </defs>
  <!-- Two signal nodes + an amber node. It rests at the bottom (so the tab
       always shows all three dots) and gently falls from the middle. -->
  <circle cx="9" cy="12" r="3.6" fill="url(#g)" />
  <circle cx="31" cy="12" r="3.6" fill="url(#g)" />
  <circle cx="20" cy="26" r="3.6" fill="#F0913A">
    <animate attributeName="cy" values="26;13;26" keyTimes="0;0.5;1" dur="2.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.33 0 0.2 1;0.6 0 0.35 1" />
  </circle>
</svg>
