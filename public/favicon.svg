<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B4BE8" />
      <stop offset=".52" stop-color="#C9407A" />
      <stop offset="1" stop-color="#F0913A" />
    </linearGradient>
  </defs>
  <!-- Two signal nodes on either side + an amber node that falls from the middle. -->
  <circle cx="9" cy="12" r="3.6" fill="url(#g)" />
  <circle cx="31" cy="12" r="3.6" fill="url(#g)" />
  <circle cx="20" r="3.6" fill="#F0913A">
    <animate attributeName="cy" values="12;31;31" keyTimes="0;0.55;1" dur="3s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.2 1;0 0 1 1" />
    <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.15;0.55;0.7;1" dur="3s" repeatCount="indefinite" />
  </circle>
</svg>
